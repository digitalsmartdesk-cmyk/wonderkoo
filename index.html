/* Layout concept: a bookshop window. Cover-forward, rounded like the logo lettering, and every season owns one logo colour. */
:root{
  --bg:#fbf6e8; --raised:#ffffff; --ink:#141414; --head:#002250; --muted:#4a4235; --rule:#e2d6b4; --line:#8a7a52;

  --sun:#fcc703; --green:#85cb12; --pink:#fb2f66; --orange:#f58402; --sky:#0090f0; --cyan:#00b8f8; --gold:#e9a820;
  --accent:var(--sun);
  --font-display:"Fredoka","Baloo 2",system-ui,sans-serif; --font-serif:"Lora",Georgia,"Times New Roman",serif;
  --r-sm:8px; --r-md:16px; --r-lg:28px;
}
@media (prefers-color-scheme: dark){

    --bg:#002250; --raised:#0a3470; --ink:#f2e4c4; --head:#f2e4c4; --muted:#c9d3e6; --rule:#1a4580; --line:#6f8fc4;
    --focus:#fcc703; --plate:#f2e4c4; --btn-bg:#fcc703; --btn-fg:#141414; --btn-edge:#fcc703; --shadow-soft:0 8px 24px rgba(0,10,28,.5); --shadow-sticker:0 4px 0 #00122b; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#002250; --raised:#0a3470; --ink:#f2e4c4; --head:#f2e4c4; --muted:#c9d3e6; --rule:#1a4580; --line:#6f8fc4;
  --focus:#fcc703; --plate:#f2e4c4; --btn-bg:#fcc703; --btn-fg:#141414; --btn-edge:#fcc703; --shadow-soft:0 8px 24px rgba(0,10,28,.5); --shadow-sticker:0 4px 0 #00122b; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:400 16px/26px var(--font-serif);padding-block:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
h1,h2,h3,p{margin:0}
a{color:inherit}
img{display:block}
button,input{font:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.wrap{max-width:1160px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.label{font:600 13px/16px var(--font-display);letter-spacing:.06em;text-transform:uppercase}
.pill{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;background:var(--raised);color:var(--ink);box-shadow:var(--shadow-sticker)}
.pill.on-accent{background:var(--navy-fill,#002250);color:#f2e4c4;box-shadow:none}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--rule)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px 24px;padding-block:10px;flex-wrap:wrap}
.brand{display:block;background:var(--plate);border-radius:var(--r-md);padding:2px 8px}
.brand img{height:54px;width:auto}
.seasons{display:flex;align-items:center;gap:8px;min-width:0;overflow-x:auto;padding:4px 4px 8px;margin-bottom:-4px}
.seasons .label{color:var(--muted);margin-right:4px;white-space:nowrap}
.chip{flex:none;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:var(--on-accent);font:600 17px/1 var(--font-display);text-decoration:none;box-shadow:0 3px 0 var(--head)}
.chip[aria-current="page"]{outline:3px solid var(--head);outline-offset:2px}
.chip:focus-visible{outline:2px solid var(--focus);outline-offset:3px}

/* buttons, forms */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:10px 22px;border-radius:999px;border:2px solid var(--btn-edge);background:var(--btn-bg);color:var(--btn-fg);font:600 15px/1 var(--font-display);letter-spacing:.02em;text-decoration:none;cursor:pointer;box-shadow:0 4px 0 rgba(0,18,43,.35)}
.btn:hover{transform:translateY(-1px)}
.btn.ghost{background:transparent;color:var(--head);border-color:var(--head)}
.launch .btn,.s-hero .btn{background:#002250;color:#f2e4c4;border-color:#002250}
.launch .btn.ghost,.s-hero .btn.ghost{background:transparent;color:#002250}
.btn.sun,.launch .btn.sun,.s-hero .btn.sun{background:var(--sun);color:#141414;border-color:#002250}
.btn[disabled]{background:transparent;color:var(--muted);border:2px dashed var(--line);box-shadow:none;cursor:not-allowed;transform:none}
.btn.sm{min-height:38px;padding:8px 16px;font-size:14px;width:100%}
.signup{display:grid;gap:8px;max-width:520px}
.signup .row{display:flex;gap:8px;flex-wrap:wrap}
.signup label{font:600 13px/16px var(--font-display);letter-spacing:.06em;text-transform:uppercase}
.signup input[type=email]{flex:1 1 220px;min-width:0;min-height:48px;padding:10px 16px;border-radius:var(--r-sm);border:2px solid #002250;background:#fff;color:#141414}
.signup .note{font-size:14px;line-height:20px}
.signup .msg{font:500 15px/22px var(--font-serif);min-height:22px}
.signup .msg.err{font-weight:600}

/* hero (home) */
.hero{padding-block:40px 56px}
.hero .wrap{display:grid;grid-template-columns:1.05fr .95fr;gap:32px 48px;align-items:center}
.hero h1{font:700 clamp(42px,7.4vw,80px)/.98 var(--font-display);color:var(--head);text-wrap:balance}
.hero h1 mark{background:linear-gradient(transparent 62%,var(--sun) 62% 92%,transparent 92%);color:inherit;padding:0 .06em}
.hero .lead{font-size:19px;line-height:30px;max-width:34em;margin-top:20px;color:var(--ink)}
.hero .ctas{display:flex;gap:12px;flex-wrap:wrap;margin-top:28px}
.hero .facts{margin-top:24px;color:var(--muted);font-size:15px}
.fan{display:flex;justify-content:center;padding:16px 12px 24px}
.fan img{width:min(34%,200px);height:auto;aspect-ratio:3/4;border-radius:10px;box-shadow:var(--shadow-soft);transform:rotate(var(--rot)) translateY(var(--dy,0));margin-left:-7%;border:3px solid var(--raised)}
.fan img:first-child{margin-left:0}

/* launch band */
.launch{background:var(--sun);color:#141414;padding-block:48px}
.launch .wrap{display:grid;grid-template-columns:1fr 1fr;gap:32px 48px;align-items:center}
.launch h2{font:700 clamp(32px,5vw,52px)/1.02 var(--font-display);text-wrap:balance;color:#002250}
.launch p.lead{font-size:18px;line-height:28px;margin:14px 0 22px;max-width:32em}
.launch .tag{margin-bottom:14px}
.mini-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.mini-grid button{padding:0;border:0;background:none;cursor:pointer;border-radius:8px}
.mini-grid img{width:100%;height:auto;aspect-ratio:3/4;border-radius:8px;box-shadow:0 5px 14px rgba(0,34,80,.3)}

/* sections */
.section{padding-block:56px}
.section h2{font:700 clamp(30px,4.6vw,44px)/1.05 var(--font-display);color:var(--head);text-wrap:balance}
.section .sub{margin-top:10px;color:var(--muted);max-width:40em}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,260px),1fr));gap:20px;margin-top:32px}
.tile{display:flex;flex-direction:column;gap:14px;padding:22px;border-radius:var(--r-lg);background:var(--accent);color:var(--on-accent);text-decoration:none;box-shadow:var(--shadow-sticker);min-width:0}
.tile:hover{transform:translateY(-2px)}
.tile .top-row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.tile h3{font:700 34px/1 var(--font-display)}
.tile p{font-size:16px;line-height:23px}
.tile .count{font:600 14px/1 var(--font-display)}
.tile .minis{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:auto}
.tile .minis img{width:100%;height:auto;aspect-ratio:3/4;border-radius:7px;box-shadow:0 4px 10px rgba(0,18,43,.3)}
.inside{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,210px),1fr));gap:0 32px;margin-top:28px}
.inside div{border-top:2px solid var(--head);padding:14px 0 20px}
.inside h3{font:600 20px/26px var(--font-display);color:var(--head)}
.inside p{margin-top:4px;color:var(--muted);font-size:15px;line-height:24px}

/* season page */
.s-hero{background:var(--accent);color:#141414;padding-block:44px 56px}
.s-hero .wrap{display:grid;grid-template-columns:1.1fr .9fr;gap:32px 48px;align-items:center}
.s-hero .badges{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}

.s-hero .tagline{font:600 clamp(20px,3vw,26px)/1.25 var(--font-display);margin-top:14px;color:#002250;text-wrap:balance}

.s-hero .meta{margin-top:14px;font-size:15px;line-height:22px}

.books{--cols:4;display:grid;grid-template-columns:repeat(var(--cols),minmax(0,1fr));gap:28px 20px;margin-top:32px}
.books[data-n="10"]{--cols:5}
.books[data-n="6"]{--cols:3}
.card{display:flex;flex-direction:column;gap:10px;min-width:0}
.card .cover{padding:0;border:0;background:none;cursor:pointer;border-radius:12px;position:relative}
.card .cover img{width:100%;height:auto;aspect-ratio:3/4;border-radius:12px;box-shadow:var(--shadow-soft);transition:transform .18s}
.card .cover:hover img{transform:translateY(-3px) rotate(-.6deg)}
.card .num{position:absolute;top:-8px;left:-8px;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:var(--on-accent);font:700 16px/1 var(--font-display);box-shadow:0 3px 0 var(--head)}
.card h3{font:600 18px/23px var(--font-display);color:var(--head)}
.card .sub2{font-size:15px;line-height:22px;color:var(--muted)}
.pager{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:48px;padding-top:24px;border-top:2px solid var(--head)}
.pager a{display:inline-flex;align-items:center;gap:10px;font:600 18px/24px var(--font-display);color:var(--head);text-decoration:none;padding:8px 0}
.pager a span.dot{width:34px;height:34px;border-radius:50%;background:var(--accent);color:#141414;display:grid;place-items:center;font-size:16px}
.pager a:hover{text-decoration:underline}

/* footer */
.foot{background:var(--head);color:var(--cream);padding-block:48px 40px;margin-top:24px}
:root[data-theme="dark"] .foot{background:#00122b;color:var(--cream)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .foot{background:#00122b;color:var(--cream)}}
.foot .wrap{display:grid;grid-template-columns:1fr 1fr;gap:28px 48px}
.foot h2{font:700 30px/1.05 var(--font-display)}
.foot p{margin-top:8px;color:#d9dfec}
.foot .signup input{border-color:#f2e4c4}
.foot .btn{background:var(--sun);color:#141414;border-color:var(--sun)}
.foot .btn[disabled]{background:transparent;color:#b9c4dc}
.foot .small{grid-column:1/-1;font-size:14px;line-height:20px;color:#b9c4dc;border-top:1px solid #1a4580;padding-top:20px}

/* dialog */
dialog{padding:0;border:0;border-radius:var(--r-lg);background:var(--raised);color:var(--ink);width:min(780px,calc(100% - 32px));max-height:calc(100% - 32px);overflow:auto;box-shadow:0 24px 60px rgba(0,10,28,.5)}
dialog::backdrop{background:var(--backdrop)}
.dlg{display:grid;grid-template-columns:260px 1fr;gap:24px 28px;padding:28px;position:relative}
.dlg img{width:100%;height:auto;aspect-ratio:3/4;border-radius:12px;box-shadow:var(--shadow-soft)}
.dlg h2{font:700 30px/1.05 var(--font-display);color:var(--head);margin-top:8px}
.dlg .sub3{font:600 20px/26px var(--font-display);margin-top:8px}
.dlg .hook{font-style:italic;font-size:19px;line-height:30px;margin-top:16px}
.dlg .buy{margin-top:20px;max-width:260px}
.dlg .close{position:absolute;top:14px;right:14px;min-height:38px;padding:6px 16px;border-radius:999px;border:2px solid var(--head);background:var(--bg);color:var(--head);font:600 14px/1 var(--font-display);cursor:pointer}
.dlg .tagpill{display:inline-block;padding:5px 12px;border-radius:999px;background:var(--accent);color:var(--on-accent)}

@media (min-width:1000px){.tiles{grid-template-columns:repeat(4,minmax(0,1fr))}.tiles .tile:last-child{grid-column:span 2}}
@media (max-width:820px){
  .books,.books[data-n="10"],.books[data-n="6"]{--cols:2;gap:24px 14px}
  .brand img{height:40px}
  .hero .wrap,.launch .wrap,.s-hero .wrap,.foot .wrap{grid-template-columns:1fr}
  .teaser{width:min(100%,300px)}
  .dlg{grid-template-columns:1fr;padding:20px}
  .dlg .cvr{max-width:230px}
  .seasons .label{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}.btn:hover,.tile:hover,.card .cover:hover img{transform:none}}
</style>

var $=function(s,r){return (r||document).querySelector(s)};
function esc(t){return String(t).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function cover(n,i){return "img/s"+n+"-b"+(i+1)+".jpg"}
function bookKey(n,i){return "s"+n+"-b"+(i+1)}
function acc(s){return "style=\"--accent:var("+s.accent+")\""}
function cap(w){return w.charAt(0).toUpperCase()+w.slice(1)}

/* signup form */
function signup(id,interest,btn,dark){
  return '<form class="signup" id="'+id+'" data-interest="'+interest+'" novalidate>'+
    '<label for="'+id+'-email">Email address</label>'+
    '<div class="row"><input type="email" id="'+id+'-email" name="email" autocomplete="email" inputmode="email" placeholder="name@example.com" required>'+
    '<button class="btn" type="submit">'+btn+'</button></div>'+
    '<p class="msg" id="'+id+'-msg" role="status" aria-live="polite"></p></form>';
}
async function submitSignup(form){
  var msg=$('.msg',form), email=form.elements.email.value.trim();
  function say(t,err){msg.textContent=t;msg.className="msg"+(err?" err":"")}
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)){say("Enter a full email address, like name@example.com.",true);return}
  if(!DB||!USER){say("Signup is not available in this view yet. Please try again later.",true);return}
  var btn=$('button',form); btn.disabled=true;
  try{
    var uid=await USER.id();
    if(!uid){say("Sign in to join the list.",true);return}
    var ref=DB.doc("signups/"+uid), interests=[form.dataset.interest];
    try{var snap=await ref.get(); if(snap.exists){var d=snap.data()||{}; interests=Array.from(new Set((d.interests||[]).concat(interests)))}}catch(e){}
    await ref.set({email:email,interests:interests,updated:new Date().toISOString()});
    say("You are on the list. We will email you when books go on sale.");
    form.elements.email.value="";
  }catch(e){say("That did not save. Check your connection and try again.",true)}
  finally{btn.disabled=false}
}

/* buy buttons */
function buyHtml(n,i,cls){
  return '<span data-buy="'+bookKey(n,i)+'" data-cls="'+(cls||"")+'"></span>';
}
function applyBuy(root){
  (root||document).querySelectorAll('[data-buy]').forEach(function(el){
    var u=buy[el.dataset.buy], cls=el.dataset.cls||"";
    if(typeof u==="string"&&/^https:\/\//.test(u)){
      el.innerHTML='<a class="btn sun '+cls+'" href="'+esc(u)+'" target="_blank" rel="noopener">Buy on Amazon</a>';
    }else{
      el.innerHTML='<button class="btn '+cls+'" type="button" disabled>Buy link coming</button>';
    }
  });
}

/* views */
function seasonNav(cur){
  $('#seasonNav').innerHTML='<span class="label">Seasons</span>'+SEASONS.map(function(s){
    return '<a class="chip" href="#season-'+s.n+'" '+acc(s)+' aria-label="Season '+s.n+': '+esc(s.name)+'"'+(cur===s.n?' aria-current="page"':'')+'>'+s.n+'</a>';
  }).join('');
}
function homeView(){
  var s1=SEASONS[0];
  var fan=[0,1,2].map(function(i){return '<img src="'+cover(1,i)+'" alt="Cover: '+esc(s1.books[i][0])+', '+esc(s1.books[i][1])+'" width="432" height="576" style="--rot:'+[-7,0,7][i]+'deg;--dy:'+[10,-8,10][i]+'px">'}).join('');
  var mini=s1.books.map(function(b,i){return '<button type="button" data-open="1,'+i+'" aria-label="'+esc(b[0])+': '+esc(b[1])+'"><img src="'+cover(1,i)+'" alt="" width="432" height="576" loading="lazy"></button>'}).join('');
  var tiles=SEASONS.map(function(s){
    var mi=[0,1,2,3].map(function(i){return '<img src="'+cover(s.n,i)+'" alt="" width="432" height="576" loading="lazy">'}).join('');
    return '<a class="tile" href="#season-'+s.n+'" '+acc(s)+'><div class="top-row"><span class="label pill on-accent">Season '+s.n+'</span><span class="count">'+s.books.length+' books</span></div><h3>'+esc(s.name)+'</h3><p>'+esc(s.tagline)+'</p><div class="minis">'+mi+'</div></a>';
  }).join('');
  return '<section class="hero"><div class="wrap"><div>'+
    '<p class="label" style="color:var(--muted)">True stories for readers aged 8 to 15</p>'+
    '<h1 style="margin-top:12px">Indians who <mark>amazed</mark> the world.</h1>'+
    '<p class="lead">Stories of Indians who saw what others could not and opened the future. Picture books, one remarkable life each, told as a story and painted page by page.</p>'+
    '<div class="ctas"><a class="btn" href="#season-1">Meet the Season 1 minds</a><a class="btn ghost" href="#season-1" data-scroll="launchSignup">Get launch news</a></div>'+
    '<p class="facts">'+TOTAL+' picture books across seven seasons. Print and Kindle.</p></div>'+
    '<div class="fan" aria-hidden="false">'+fan+'</div></div></section>'+
  '<section class="launch" '+acc(s1)+'><div class="wrap"><div>'+
    '<p class="label tag pill on-accent">Launching now: Season 1</p>'+
    '<h2>Minds Universe</h2>'+
    '<p class="lead">'+esc(s1.tagline)+' Start with the boy who saw numbers no one else could see. Leave your email and we will tell you the day the first books go on sale.</p>'+
    signup('homeSignup','season-1','Notify me')+
    '<p style="margin-top:12px"><a href="#season-1" style="font:600 16px/1 var(--font-display);color:#002250">See all eight books</a></p></div>'+
    '<div class="mini-grid">'+mini+'</div></div></section>'+
  '<section class="section"><div class="wrap"><h2>Seven seasons. One shelf.</h2><p class="sub">Each season is a universe of its own. Pick one and open the page to see every cover.</p><div class="tiles">'+tiles+'</div></div></section>'+
  '<section class="section" style="padding-top:8px"><div class="wrap"><h2>Inside every book</h2><div class="inside">'+
    '<div><h3>A story to read</h3><p>A life told as a story, opening on the moment that shows what the person could do.</p></div>'+
    '<div><h3>A ten-question quiz</h3><p>Three choices for each question, with answers at the back.</p></div>'+
    '<div><h3>Five lessons</h3><p>What the person\'s life can teach a reader today.</p></div>'+
    '<div><h3>Seven did you know facts</h3><p>Small surprises to share at dinner.</p></div>'+
    '<div><h3>Where it comes from</h3><p>Sources, further reading, and a clear line between documented history and legend.</p></div>'+
  '</div></div></section>';
}
function seasonView(n){
  var s=SEASONS[n-1], first=(n===1), prev=SEASONS[n-2], next=SEASONS[n];
  var cards=s.books.map(function(b,i){
    return '<article class="card"><button class="cover" type="button" data-open="'+n+','+i+'" aria-label="Open '+esc(b[0])+': '+esc(b[1])+'"><span class="num" aria-hidden="true">'+(i+1)+'</span><img src="'+cover(n,i)+'" alt="Cover: '+esc(b[0])+', '+esc(b[1])+'" width="432" height="576" loading="lazy"></button>'+
      '<div><h3>'+esc(b[0])+'</h3><p class="sub2">'+esc(b[1])+'</p></div>'+(first?buyHtml(n,i,"sm"):'')+'</article>';
  }).join('');
  var badges='<span class="label pill on-accent">Season '+n+' of 7</span>'+(first?'<span class="label pill" style="background:#fff;color:#141414">Launching</span>':'');
  var meta=cap(WORDS[s.books.length])+' picture books. 7.5 by 10 inch pages, in print and on Kindle.';
  var form=first
    ? '<div class="signup-box" id="launchSignup"><p class="label" style="margin-bottom:10px;color:#002250">The first books go on sale soon</p>'+signup('s1Signup','season-1','Notify me')+'</div>'
    : '<div class="signup-box"><p class="meta">All '+WORDS[s.books.length]+' covers are designed. Join the list to hear when this season opens.</p><p style="margin-top:12px"><a class="btn" href="#season-1">Start with Season 1</a></p></div>';
  var pager='<nav class="pager" aria-label="Other seasons">'+
    (prev?'<a href="#season-'+prev.n+'" '+acc(prev)+'><span class="dot">'+prev.n+'</span>'+esc(prev.name)+'</a>':'<a href="#home">Home</a>')+
    (next?'<a href="#season-'+next.n+'" '+acc(next)+'>'+esc(next.name)+'<span class="dot">'+next.n+'</span></a>':'<a href="#home">Home</a>')+'</nav>';
  return '<section class="s-hero" '+acc(s)+'><div class="wrap"><div><div class="badges">'+badges+'</div>'+
    '<h1>'+esc(s.name)+(n===7?'':' Universe')+'</h1><p class="tagline">'+esc(s.tagline)+'</p><p class="blurb">'+esc(s.blurb)+'</p><p class="meta">'+meta+'</p>'+form+'</div>'+
    '<figure class="teaser" style="margin:0"><img src="img/s'+n+'-teaser.jpg" alt="Season '+n+' teaser page showing all '+WORDS[s.books.length]+' book covers" width="576" height="768"><figcaption>The season teaser, printed at the end of every book in the season.</figcaption></figure></div></section>'+
  '<section class="section" '+acc(s)+'><div class="wrap"><h2>The '+WORDS[s.books.length]+' books of Season '+n+'</h2><p class="sub">Tap a cover for the book\'s opening line.</p><div class="books" data-n="'+s.books.length+'">'+cards+'</div>'+pager+'</div></section>';
}
function openBook(n,i){
  var s=SEASONS[n-1], b=s.books[i], d=$('#bookDialog');
  d.style.setProperty('--accent','var('+s.accent+')');
  d.innerHTML='<div class="dlg"><button class="close" type="button" data-close>Close</button>'+
    '<div class="cvr"><img src="'+cover(n,i)+'" alt="Cover: '+esc(b[0])+', '+esc(b[1])+'" width="432" height="576"></div>'+
    '<div><span class="label tagpill">Season '+n+' · Book '+(i+1)+'</span><h2>'+esc(b[0])+'</h2><p class="sub3">'+esc(b[1])+'</p><p class="hook">'+esc(b[2])+'</p>'+
    (n===1?'<div class="buy">'+buyHtml(n,i,"")+'</div>':'<p style="margin-top:18px;color:var(--muted)">Season '+n+' opens after Season 1. Join the list below the page to hear when.</p>')+'</div></div>';
  applyBuy(d);
  if(typeof d.showModal==="function"){ if(!d.open) d.showModal(); } else d.setAttribute('open','');
}

/* router */
function route(){
  var h=location.hash.replace('#',''), m=/^season-([1-7])$/.exec(h), n=m?+m[1]:0;
  $('#view').innerHTML=n?seasonView(n):homeView();
  seasonNav(n);
  $('#footSignup').innerHTML=signup('footForm',n?'season-'+n:'all','Notify me');
  applyBuy(); window.scrollTo(0,0);
}
document.addEventListener('submit',function(e){var f=e.target.closest('.signup'); if(f){e.preventDefault(); submitSignup(f)}});
document.addEventListener('click',function(e){
  var o=e.target.closest('[data-open]');
  if(o){var p=o.dataset.open.split(','); openBook(+p[0],+p[1]); return}
  if(e.target.closest('[data-close]')){$('#bookDialog').close(); return}
  if(e.target===$('#bookDialog')) $('#bookDialog').close();
  var sc=e.target.closest('[data-scroll]');
  if(sc){ setTimeout(function(){var t=document.getElementById(sc.dataset.scroll); if(t) t.scrollIntoView({block:'center'})},60); }
});
window.addEventListener('hashchange',route);
route();

/* runtime: db + user, lit up when available */
(async function(){
  try{
    if(!window.claude||!window.claude.use) return;
    DB=await window.claude.use('db'); USER=await window.claude.use('user');
    if(DB){ DB.doc('config/buy').onSnapshot(function(s){ buy=s.exists?(s.data()||{}):{}; applyBuy(); },function(){}); }
  }catch(e){}
})();
})();
</script>
